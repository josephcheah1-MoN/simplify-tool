<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="简化工具" />
<meta name="theme-color" content="#F5F6F9" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#10131A" media="(prefers-color-scheme: dark)" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✂️</text></svg>" />
<title>表达式简化工具</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<style>
  :root {
    --bg: #F5F6F9;
    --card: #FFFFFF;
    --ink: #1C2130;
    --muted: #667085;
    --border: #E0E4EC;
    --accent: #2E5BE6;
    --accent-press: #244AC2;
    --accent-contrast: #FFFFFF;
    --ring: rgba(46, 91, 230, .28);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10131A;
      --card: #191E29;
      --ink: #E9EDF6;
      --muted: #9AA3B8;
      --border: #2B3242;
      --accent: #4E73F0;
      --accent-press: #3D5FD6;
      --accent-contrast: #FFFFFF;
      --ring: rgba(124, 151, 255, .35);
    }
  }
  :root[data-theme="light"] {
    --bg: #F5F6F9;
    --card: #FFFFFF;
    --ink: #1C2130;
    --muted: #667085;
    --border: #E0E4EC;
    --accent: #2E5BE6;
    --accent-press: #244AC2;
    --accent-contrast: #FFFFFF;
    --ring: rgba(46, 91, 230, .28);
  }
  :root[data-theme="dark"] {
    --bg: #10131A;
    --card: #191E29;
    --ink: #E9EDF6;
    --muted: #9AA3B8;
    --border: #2B3242;
    --accent: #4E73F0;
    --accent-press: #3D5FD6;
    --accent-contrast: #FFFFFF;
    --ring: rgba(124, 151, 255, .35);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
    line-height: 1.55;
    -webkit-text-size-adjust: 100%;
  }

  .app {
    max-width: 640px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 18px 16px calc(28px + env(safe-area-inset-bottom));
    padding-left: max(16px, env(safe-area-inset-left));
    padding-right: max(16px, env(safe-area-inset-right));
  }

  header h1 {
    font-size: 20px;
    font-weight: 700;
    margin: 0;
    letter-spacing: .01em;
  }
  header .sub {
    margin: 2px 0 0;
    font-size: 13px;
    color: var(--muted);
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px;
  }

  .cardhead {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 8px;
  }
  .cardhead label {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .08em;
  }
  .cardhead .meta {
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  textarea {
    width: 100%;
    min-height: 170px;
    border: none;
    outline: none;
    resize: vertical;
    background: transparent;
    color: var(--ink);
    font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 16px; /* 16px 起步，避免 iOS 聚焦时自动放大页面 */
    line-height: 1.5;
    padding: 0;
  }
  textarea::placeholder { color: var(--muted); opacity: .7; }
  .card:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--ring); }

  .actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  button {
    appearance: none;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--ink);
    font: inherit;
    font-size: 16px;
    font-weight: 600;
    min-height: 48px;
    border-radius: 12px;
    padding: 10px 14px;
    cursor: pointer;
    touch-action: manipulation;
  }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-contrast);
  }
  button.primary:active { background: var(--accent-press); }
  button:not(.primary):active { border-color: var(--accent); }
  button.ghost {
    min-height: 0;
    border: none;
    background: none;
    color: var(--muted);
    font-size: 13px;
    font-weight: 500;
    padding: 4px 6px;
  }
  button.ghost:active { color: var(--accent); }

  #output {
    min-height: 96px;
    white-space: pre-wrap;
    word-break: break-all;
    font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 16px;
    font-variant-numeric: tabular-nums;
    -webkit-user-select: all;
    user-select: all; /* 轻点即可全选，方便手动长按复制 */
  }
  #output.empty {
    color: var(--muted);
    opacity: .7;
    -webkit-user-select: none;
    user-select: none;
    font-family: inherit;
    font-size: 14px;
  }

  #toast {
    position: fixed;
    left: 50%;
    bottom: calc(30px + env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(8px);
    background: var(--ink);
    color: var(--bg);
    font-size: 14px;
    font-weight: 500;
    padding: 9px 16px;
    border-radius: 999px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .18s ease, transform .18s ease;
    max-width: 86vw;
    text-align: center;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  @media (prefers-reduced-motion: reduce) {
    #toast { transition: none; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>表达式简化工具</h1>
    <p class="sub">粘贴原始文本，自动整理成标准格式</p>
  </header>

  <section class="card">
    <div class="cardhead">
      <label for="input">输入</label>
      <button id="clearButton" class="ghost" type="button">清空</button>
    </div>
    <textarea id="input" placeholder="粘贴原始文本（支持多行、时间戳、中英文括号、大小/打/box 等写法）" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>
  </section>

  <div class="actions">
    <button id="simplifyButton" class="primary" type="button">简化</button>
    <button id="copyButton" type="button">复制结果</button>
  </div>

  <section class="card">
    <div class="cardhead">
      <label for="output">输出结果</label>
      <span class="meta" id="count"></span>
    </div>
    <div id="output" class="empty">结果会显示在这里</div>
  </section>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
  // —— 简化核心逻辑（与电脑版 simplify.html 完全一致）—— //
  function simplifyExpression(raw) {
    let s = raw;
    // 0) 中英括号统一
    s = s.replace(/（/g,"(").replace(/）/g,")");
    // 1) 去除 [ ... ]（时间戳/标记）
    s = s.replace(/\[[^\]]*\]/g," ");
    // 2) 去除已知前缀
    s = s.replace(/A201 Sms:/g," ").replace(/201 定期:/g," ");
    // 2.5) NNNN=a=b → NNNN a-b（如 1510=2=5 → 1510 2-5），必须在“=”统一替换前处理
    s = s.replace(/(?<!\S)(\d{4})=(\d+)=(\d+)(?!\S)/g,"$1 $2-$3");
    // 2.5b) NNNN=a/b → NNNN a-b（如 2586=1/2 → 2586 1-2；a、b 限 1~2 位，不影响旧的 =200/300 金额写法）
    s = s.replace(/(?<!\S)(\d{4})=(\d{1,2})\/(\d{1,2})(?!\S)/g,"$1 $2-$3");
    // 2.5c) 独立的 a/b → a-b（如 2/4 → 2-4；a、b 限 1~2 位，不影响 200/300 金额写法）
    s = s.replace(/(?<!\S)(\d{1,2})\/(\d{1,2})(?!\S)/g,"$1-$2");
    // 2.5d) NNNN[r].a-b → NNNN[r] a-b（如 5214r.1-2 → 5214r 1-2、1073.1.5-0 → 1073 1.5-0、
    //       3211r.h-0 → 3211r h-0、6029.2h-0 → 6029 2h-0）；号码自带的 r 原样保留，
    //       比例两侧可为整数/小数/带 h 后缀(2h)/单独 h
    s = s.replace(/(?<!\S)(\d{4}r?)\.((?:\d+(?:\.\d+)?[hH]?|[hH])-(?:\d+(?:\.\d+)?[hH]?|[hH]))(?!\S)/g,"$1 $2");
    // 2.6) N大M小 → N-M（如 2大20小 → 2-20），必须在“大/小”单独替换前处理
    s = s.replace(/(\d+)大(\d+)小/g,"$1-$2");
    // 2.6b) Nb Ms → N-M（如 2b 2s → 2-2，b/s 等同 大/小），必须在 2.6c 前处理
    s = s.replace(/(?<!\S)(\d+)b\s*(\d+)s(?!\S)/g,"$1-$2");
    // 2.6c) 单独的 Nb / Ns → N（如 1b → 1）
    s = s.replace(/(?<!\S)(\d+)[bs](?!\S)/g,"$1");
    // 2.7) 中文逗号/句号 → 空格
    s = s.replace(/[，。]/g," ");
    // 2.7b) “all” 只是标记词，直接去掉（如 6560 all 1—2 → 6560 1-2）
    s = s.replace(/(?<!\S)all(?!\S)/gi," ");
    // 2.8) NNNN___a_b → NNNN a-b（如 5983___1_2 → 5983 1-2）
    s = s.replace(/(?<!\S)(\d{4})_+(\d+)_(\d+)(?!\S)/g,"$1 $2-$3");
    // 2.8b) 开头多余的下划线去掉（如 _5大10小 → 5大10小；不影响 2.8 的数字后下划线）
    s = s.replace(/(?<!\S)_+(?=\d)/g,"");
    // 2.8c) 独立的 a_b → a-b（如 1_2 → 1-2；a、b 限 1~2 位，不影响 2.8 的 NNNN___a_b）
    s = s.replace(/(?<!\S)(\d{1,2})_(\d{1,2})(?!\S)/g,"$1-$2");
    // 2.9) 波浪号/长横线统一成 -（如 2128～5～10 → 2128-5-10，1—2 → 1-2）
    s = s.replace(/[～〜~—–―－]/g,"-");
    // 2.9b) 连续多个 - 合并成一个（如 6560--2--4 → 6560-2-4）
    s = s.replace(/-{2,}/g,"-");
    // 2.10) 独立比例前多余的 - 去掉（如 -5-10 → 5-10）
    s = s.replace(/(?<!\S)-(\d+(?:-\d+)+)(?!\S)/g,"$1");
    // 2.10b) “全打”等同“打”，并提前拆成独立 token（如 9888-1-1全打 → 9888-1-1 打，
    //        这样 2.11 才能把紧贴的比例拆出来；“打”的加 r 逻辑仍在 4.5 统一处理）
    s = s.replace(/全?打/g," 打 ");
    // 2.10c) R 前缀比例：R1-2 → 1-2 打（R 等同“打”，给前面这组号码加 r，
    //        如 2022 8777 R1---2 → 2022r 8777r 1-2；加 r 逻辑仍在 4.5 统一处理）
    s = s.replace(/(?<!\S)[Rr](\d{1,2}-\d{1,2})(?!\S)/g,"$1 打");
    // 2.11) 四位数紧跟比例时拆开（如 2128-1-12 → 2128 1-12）
    s = s.replace(/(?<!\S)(\d{4})-(\d{1,2}-\d{1,2})(?!\S)/g,"$1 $2");
    // 2.11b) 多个四位数用 - 串起来时拆开（如 3108-1083-2174 → 3108 1083 2174）
    s = s.replace(/(?<!\d)(\d{4})-(?=\d{4}(?!\d))/g,"$1 ");
    // 3) 字符替换（“打”改到 4.5 处理：需先判断是否给前面的号码加 r）
    s = s.replace(/\//g," ").replace(/=/g," ").replace(/大/g,"")
         .replace(/X/g,".5").replace(/\+/g,"-").replace(/&/g,"-")
         .replace(/小/g," ");
    // 4) 括号内四位数加 r，再去掉括号；并清理遗留括号
    s = s.replace(/\([^)]*\)/g, seg => {
      const inner = seg.slice(1,-1);
      const replaced = inner.replace(/(?<!\d)(\d{4})(?!\d)/g,"$1r");
      return " "+replaced+" ";
    }).replace(/[()]/g," ");
    // 4.5) “打”规则：形如「四位号码… a-b 打」或「四位号码… 金额 打」时，
    //      该组四位号码全部加 r（组以上一个 a-b 比例/金额为界，如 6336=1打 → 6336r 1）；
    //      不紧跟在比例/金额后面的“打”维持旧行为，直接去掉
    s = s.replace(/打/g," 打 ");
    const daTokens = s.split(/\s+/).filter(Boolean);
    const daOut = [];
    let daGroup = [];      // 当前组内“纯四位数字”在 daOut 中的下标
    let daPending = null;  // 刚遇到比例/金额，等待下一个 token 是否为“打”
    // 比例的组成部分与 2.5d 保持一致：整数/小数/带 h 后缀(2h)/单独 h
    const daIsRatio = t => /^(?:\d+(?:\.\d+)?[hH]?|[hH])-(?:\d+(?:\.\d+)?[hH]?|[hH])$/.test(t);
    const daIsAmount = t => /^\d+(?:\.\d+)?$/.test(t) && !/^\d{4}$/.test(t);
    for (const tok of daTokens) {
      if (tok === "打") {
        if (daPending) daPending.forEach(i => daOut[i] += "r");
        daPending = null;
        continue;
      }
      daPending = null;
      if (/^\d{4}$/.test(tok)) { daGroup.push(daOut.length); daOut.push(tok); }
      else if (daIsRatio(tok) || daIsAmount(tok)) { daOut.push(tok); daPending = daGroup; daGroup = []; }
      else daOut.push(tok);
    }
    s = daOut.join(" ");
    // 5) 收尾空白
    return s.trim().replace(/\s+/g," ");
  }

  function simplifyText(text) {
    const lines = text.replace(/\r\n/g,"\n").replace(/\r/g,"\n").split("\n");
    const groups=[]; let buf=[];
    const flush=()=>{ if(!buf.length)return;
      const simplified=simplifyExpression(buf.join(" "));
      const tokens=simplified.trim().split(/\s+/);
      groups.push(tokens.join(" "));
      buf=[];};
    for(const raw of lines){
      let line=(raw||"").trim();
      if(!line){flush();continue;}
      if(line.toLowerCase()==="quit") continue;
      // “box”规则：该行的四位号码全部加 r，box 本身去掉（box 按行生效）
      if(/(?<!\S)box(?!\S)/i.test(line)){
        line=line.replace(/(?<!\S)box(?!\S)/gi," ")
                 .replace(/(?<!\S)(\d{4})(?!\S)/g,"$1r");
      }
      buf.push(line);
    }
    flush();
    return groups.join("   ");
  }

  // —— 将输出里的 `$` 统一变成 `****$` —— //
  function applyDollarStars(s) {
    return s.replace(/\$/g, "****$");
  }

  // —— 界面交互 —— //
  const $ = id => document.getElementById(id);
  let toastTimer = null;

  function showToast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
  }

  function compute() {
    return applyDollarStars(simplifyText($("input").value || ""));
  }

  function render() {
    const out = compute();
    const box = $("output");
    if (out.trim()) {
      box.textContent = out;
      box.classList.remove("empty");
      $("count").textContent = "共 " + out.trim().split(/\s+/).length + " 项";
    } else {
      box.textContent = "结果会显示在这里";
      box.classList.add("empty");
      $("count").textContent = "";
    }
    return out;
  }

  // 输入时实时简化（粘贴即出结果）
  $("input").addEventListener("input", render);

  // 【简化】按钮：手动触发并滚动到结果
  $("simplifyButton").addEventListener("click", () => {
    render();
    $("output").scrollIntoView({ block: "nearest", behavior: "smooth" });
  });

  // 【清空】
  $("clearButton").addEventListener("click", () => {
    $("input").value = "";
    render();
    $("input").focus();
  });

  // 【复制结果】— 从输入重算，确保复制与显示一致
  $("copyButton").addEventListener("click", async () => {
    const plain = render();
    if (!plain.trim()) { showToast("先粘贴要简化的内容"); return; }
    try {
      await navigator.clipboard.writeText(plain);
      showToast("已复制到剪贴板");
    } catch (e) {
      // 兼容方案（例如部分旧版 iOS）
      try {
        const temp = document.createElement("textarea");
        temp.value = plain;
        temp.setAttribute("readonly", "");
        temp.style.position = "fixed";
        temp.style.opacity = "0";
        document.body.appendChild(temp);
        temp.select();
        temp.setSelectionRange(0, temp.value.length);
        document.execCommand("copy");
        document.body.removeChild(temp);
        showToast("已复制到剪贴板");
      } catch (e2) {
        showToast("复制失败，请长按结果手动复制");
      }
    }
  });
</script>
</body>
</html>
